[package]
name = "icu_casemap"
description = "Unicode case mapping and folding algorithms"
categories.workspace = true
keywords = ["unicode", "casing", "case-folding", "text-processing"]

authors.workspace = true
edition.workspace = true
homepage.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
# Reuse the published ICU 2.2 dependencies when consuming this backport via Git.
# Workspace path dependencies would pull duplicate crates from the fork.
icu_collections = { version = "~2.2.0", default-features = false, features = ["alloc"] }
icu_locale_core = { version = "2.2.0", default-features = false, features = ["alloc"] }
icu_properties = { version = "~2.2.0", default-features = false }
icu_provider = { version = "2.2.0", default-features = false, features = ["alloc"] }
potential_utf = { version = "0.1.3", default-features = false, features = ["alloc", "zerovec"] }
writeable = { version = "0.6.1", default-features = false }
zerovec = { version = "0.11.6", default-features = false, features = ["alloc", "yoke"] }

databake = { version = "0.2.0", default-features = false, features = ["derive"], optional = true}
serde = { workspace = true, features = ["derive", "alloc"], optional = true }

icu_casemap_data = { version = "~2.2.0", default-features = false, optional = true }

[dev-dependencies]
icu_normalizer = { version = "~2.2.0", features = ["compiled_data"] }
icu_collections = { version = "~2.2.0", default-features = false, features = ["databake"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }

[features]
default = ["compiled_data"]
serde = ["dep:serde", "zerovec/serde", "icu_collections/serde", "icu_provider/serde", "icu_properties/serde", "potential_utf/serde"]
datagen = ["serde", "dep:databake", "zerovec/databake", "icu_collections/databake", "icu_provider/export"]
compiled_data = ["dep:icu_casemap_data", "icu_properties/compiled_data", "icu_provider/baked"]

[package.metadata.cargo-all-features]
skip_optional_dependencies = true

[[test]]
name = "conversions"
required-features = ["compiled_data"]

[[test]]
name = "gen_greek_to_me"
harness = false
required-features = ["compiled_data", "datagen"] # datagen bound can be removed after #3624


[[bench]]
name = "casemap"
harness = false
required-features = ["compiled_data"]

[lints]
workspace = true
